<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ajax Learn</title>
</head>
    <body>
    <h1> Ajax Learning</h1>
    <div id="view">
        <p id="info">click button below，fetch data form Ajax</p>
    </div>
    <button type="button" id="btn">Start Ajax Request</button>
    <script>
        document.getElementById('btn').onclick = ajaxRequest;
        function ajaxRequest() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain', true);
            xhr.send();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        // xhr.responseText contains the response data from the server as a string
                        document.getElementById('info').innerHTML = 'Fetched data: ' + xhr.responseText;
                    } else {
                        console.error('Error fetching data: status ' + xhr.status);
                    }
                }
            }
        }
    </script>
    </body>
</html>
